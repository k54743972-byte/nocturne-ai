
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOCTURNE AI</title>
  <style>
    body {
      background: #101019;
      color: #f5f3ff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 35px 16px;
    }
    main {
      max-width: 600px;
      margin: auto;
      background: #1c1b2b;
      padding: 24px;
      border-radius: 18px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
    input { background: #29283a; color: white; }
    button {
      background: #8b5cf6;
      color: white;
      border: 0;
    }
    a { color: #c4b5fd; }
  </style>
</head>
<body>
  <main>
    <h1>NOCTURNE AI</h1>
    <p>Dark Fantasy AI Image Generator</p>
    <input id="prompt"
      placeholder="Describe your dream image...">
    <button onclick="generate()">Generate Image</button>
    <p id="status">Connect your AI engine to begin.</p>
    <img id="result" style="width:100%;border-radius:12px">
  </main>
  <script>
    async function generate() {
      document.getElementById("status").textContent =
        "AI backend is not connected yet.";
    }
  </script>
</body>
</html>
