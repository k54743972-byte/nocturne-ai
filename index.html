
<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

const BACKEND_URL = "https://YOUR-LIVE-LINK.gradio.live";

const button = document.querySelector("button");
const promptInput = document.getElementById("prompt");
const status = document.getElementById("status");
const resultImage = document.getElementById("result");

button.addEventListener("click", async () => {
  const prompt = promptInput.value.trim();

  if (!prompt) {
    status.textContent = "Please enter a prompt.";
    return;
  }

  button.disabled = true;
  status.textContent = "Connecting to AI...";

  try {
    const client = await Client.connect(BACKEND_URL);

    status.textContent = "Generating image...";

    const result = await client.predict("/predict", [prompt]);
    const image = result.data[0];

    resultImage.src =
      typeof image === "string" ? image : image.url;

    status.textContent = "Image generated successfully!";
  } catch (error) {
    console.error(error);
    status.textContent =
      "Error: " + (error.message || "Could not connect to AI.");
  } finally {
    button.disabled = false;
  }
});
</script>
